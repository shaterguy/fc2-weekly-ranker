name: External playback API 34 diagnostic

on:
  push:
    branches:
      - 'v0.2.0-dev24'
  workflow_dispatch:
    inputs:
      smoothness_profile:
        description: Smoothness expectation for the checked-out branch
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - baseline

permissions:
  contents: read
  actions: read

jobs:
  diagnose-external-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'

      - name: Install Android build and emulator packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Build diagnostic app and receiver
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :external-stream-receiver:assembleDebug
          test -s "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          test -s "$(find external-stream-receiver/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Sign diagnostic provider APK
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/37.0.0"
          UNSIGNED="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          OUT="$RUNNER_TEMP/external-playback-diagnostic"
          KEYSTORE="$RUNNER_TEMP/external-playback-diagnostic.jks"
          mkdir -p "$OUT"
          ALIGNED="$OUT/fc2-weekly-ranker-diagnostic-aligned.apk"
          APK="$OUT/fc2-weekly-ranker-diagnostic.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname 'CN=FC2 External Playback Diagnostic,O=OpenAI Test,C=US' \
            -keyalg RSA \
            -validity 3650 >/dev/null 2>&1
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$APK" \
            "$ALIGNED"
          "$BT/apksigner" verify --verbose --min-sdk-version 29 "$APK"
          BADGING="$("$BT/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.fc2weeklyranker.dev'" <<<"$BADGING"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Boot Android 14 emulator
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME=fc2-external-api34
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-34;google_apis;x86_64" \
            --device pixel \
            --path "$ANDROID_AVD_HOME/$AVD_NAME.avd"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/fc2-external-emulator.log" 2>&1 &
          timeout 180s adb wait-for-device
          for _ in $(seq 1 120); do
            [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk

      - name: Reproduce ordinary-process playback through delayed short-206 fixture
        shell: bash
        env:
          DIAGNOSTIC_APK: ${{ steps.sign.outputs.apk }}
          SMOOTHNESS_PROFILE: ${{ inputs.smoothness_profile || 'candidate' }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/external-playback-diagnostic"
          RECEIVER_APK="$(find external-stream-receiver/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          APP_PACKAGE=com.shaterguy.fc2weeklyranker.dev
          RECEIVER_PACKAGE=com.shaterguy.fc2weeklyranker.externalreceiver
          FIXTURE_SOURCE='https://storage.googleapis.com/exoplayer-test-media-0/BigBuckBunny_320x180.mp4'
          FIXTURE_MEDIA="$OUT/fixture.mp4"
          FIXTURE_LOG="$OUT/fixture-server.log"
          mkdir -p "$OUT"
          printf '%s\n' "$FIXTURE_SOURCE" > "$OUT/fixture-source.txt"
          curl --fail --location --retry 3 --retry-delay 2 --output "$FIXTURE_MEDIA" "$FIXTURE_SOURCE"
          test -s "$FIXTURE_MEDIA"
          python3 scripts/delayed_short206_server.py \
            --file "$FIXTURE_MEDIA" \
            --host 0.0.0.0 \
            --port 18080 \
            --max-body-bytes 8192 \
            --delay-ms 12 \
            >"$FIXTURE_LOG" 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 50); do
            if curl --fail --silent --head http://127.0.0.1:18080/video.mp4 >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent --head http://127.0.0.1:18080/video.mp4 >/dev/null

          adb install -r "$DIAGNOSTIC_APK"
          adb install -r "$RECEIVER_APK"
          adb reverse tcp:18080 tcp:18080
          adb shell am force-stop "$APP_PACKAGE" || true
          adb shell am force-stop "$RECEIVER_PACKAGE" || true
          adb logcat -c
          adb shell am start -W \
            -n "$APP_PACKAGE/com.shaterguy.fc2weeklyranker.media.ExternalStreamDiagnosticActivity" \
            --es sourceUrl 'http://localhost:18080/video.mp4' \
            | tee "$OUT/launch.txt"

          CURRENT_USER="$(adb shell am get-current-user | tr -d '\r')"
          UID_LINE="$(adb shell cmd package list packages -U --user "$CURRENT_USER" "$APP_PACKAGE" | tr -d '\r')"
          APP_UID="$(sed -n 's/^package:.* uid:\([0-9][0-9]*\)$/\1/p' <<<"$UID_LINE" | sed -n '1p')"
          if [[ ! "$APP_UID" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve numeric app UID for $APP_PACKAGE; package-manager output: $UID_LINE"
            exit 1
          fi
          : > "$OUT/process-state.txt"
          : > "$OUT/filtered-logcat.txt"

          RESULT_FOUND=0
          for second in $(seq 0 170); do
            {
              printf 't=%ss uid=%s uidState=' "$second" "$APP_UID"
              adb shell cmd activity get-uid-state "$APP_UID" 2>/dev/null | tr -d '\r' || true
              adb shell dumpsys activity lru 2>/dev/null | grep -F "$APP_PACKAGE" | head -n 2 || true
              adb shell dumpsys activity processes 2>/dev/null | grep -F -A 16 -B 2 "$APP_PACKAGE" | head -n 24 || true
              printf '\n'
            } >> "$OUT/process-state.txt"

            adb logcat -d -v monotonic \
              -s FC2ExternalLaunch:I FC2ExternalTest:I '*:S' \
              > "$OUT/filtered-logcat.txt" || true
            if grep -Fq 'result scenario=long-decoder' "$OUT/filtered-logcat.txt"; then
              RESULT_FOUND=1
              break
            fi
            sleep 1
          done

          cat "$OUT/filtered-logcat.txt"
          echo '--- provider process state samples ---'
          cat "$OUT/process-state.txt"
          echo '--- delayed short-206 fixture tail ---'
          tail -n 80 "$FIXTURE_LOG" || true
          [[ "$RESULT_FOUND" == '1' ]]
          RESULT_LINE="$(grep -F 'result scenario=long-decoder' "$OUT/filtered-logcat.txt" | tail -n 1)"
          printf '%s\n' "$RESULT_LINE" > "$OUT/result.txt"
          if grep -Fq 'ok=false' <<<"$RESULT_LINE"; then
            printf 'REPRODUCED_FAILURE\n' > "$OUT/outcome.txt"
            cat "$OUT/outcome.txt"
            exit 1
          elif ! grep -Fq 'ok=true' <<<"$RESULT_LINE"; then
            printf 'UNCLASSIFIED_RESULT\n' > "$OUT/outcome.txt"
            exit 1
          fi

          metric() {
            local key="$1"
            grep -o "${key}=[-0-9]*" <<<"$RESULT_LINE" | tail -n 1 | cut -d= -f2
          }
          STARTUP_MS="$(metric startupMs)"
          STALL_COUNT="$(metric stallCount)"
          STALL_DURATION_MS="$(metric stallDurationMs)"
          MAX_NO_PROGRESS_MS="$(metric maxNoProgressMs)"
          BUFFERING_COUNT="$(metric bufferingCount)"
          BUFFERING_DURATION_MS="$(metric bufferingDurationMs)"
          for value in "$STARTUP_MS" "$STALL_COUNT" "$STALL_DURATION_MS" "$MAX_NO_PROGRESS_MS" "$BUFFERING_COUNT" "$BUFFERING_DURATION_MS"; do
            [[ "$value" =~ ^-?[0-9]+$ ]]
          done

          cat > "$OUT/smoothness-metrics.txt" <<EOF
          profile=$SMOOTHNESS_PROFILE
          startup_ms=$STARTUP_MS
          stall_count=$STALL_COUNT
          stall_duration_ms=$STALL_DURATION_MS
          max_no_progress_ms=$MAX_NO_PROGRESS_MS
          buffering_count=$BUFFERING_COUNT
          buffering_duration_ms=$BUFFERING_DURATION_MS
          EOF

          python3 - "$FIXTURE_LOG" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')
          rows = re.findall(r"requested=(\d+)-(\d+) returned=(\d+)-(\d+)", text)
          if len(rows) < 32:
              raise SystemExit(f"expected at least 32 delayed range responses, got {len(rows)}")

          parsed = []
          for requested_start, requested_end, returned_start, returned_end in rows:
              rs = int(requested_start)
              re_ = int(requested_end)
              ss = int(returned_start)
              se = int(returned_end)
              requested_span = re_ - rs + 1
              returned_span = se - ss + 1
              if ss != rs:
                  raise SystemExit(f"returned range start mismatch: requested={rs}-{re_} returned={ss}-{se}")
              if se > re_:
                  raise SystemExit(f"returned range exceeded request end: requested={rs}-{re_} returned={ss}-{se}")
              if returned_span <= 0 or returned_span > 8192:
                  raise SystemExit(f"returned range span violated capped fixture: {returned_span}")
              parsed.append((requested_span, returned_span))

          initial_short = sum(1 for requested_span, returned_span in parsed if returned_span < requested_span)
          learned_exact_8192 = sum(
              1 for requested_span, returned_span in parsed
              if requested_span == 8192 and returned_span == 8192
          )
          if initial_short < 1:
              raise SystemExit("capped short-206 discovery response was not observed")
          if learned_exact_8192 < 16:
              raise SystemExit(f"learned exact 8192-byte 206 path was not exercised enough: {learned_exact_8192}")
          print(
              "FC2_SHORT206_METRIC "
              f"range_responses={len(rows)} "
              f"initial_short_responses={initial_short} "
              f"learned_exact_8192={learned_exact_8192}"
          )
          PY

          if [[ "$SMOOTHNESS_PROFILE" == 'candidate' ]]; then
            (( STARTUP_MS >= 0 && STARTUP_MS <= 8000 ))
            (( STALL_COUNT <= 2 ))
            (( STALL_DURATION_MS <= 3000 ))
            (( MAX_NO_PROGRESS_MS <= 2000 ))
            (( BUFFERING_DURATION_MS <= 5000 ))
            printf 'SMOOTHNESS_GATE_PASS\n' > "$OUT/outcome.txt"
          else
            printf 'BASELINE_MEASURED\n' > "$OUT/outcome.txt"
          fi
          cat "$OUT/smoothness-metrics.txt"
          cat "$OUT/outcome.txt"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-playback-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-playback-diagnostic/launch.txt
            ${{ runner.temp }}/external-playback-diagnostic/process-state.txt
            ${{ runner.temp }}/external-playback-diagnostic/filtered-logcat.txt
            ${{ runner.temp }}/external-playback-diagnostic/result.txt
            ${{ runner.temp }}/external-playback-diagnostic/outcome.txt
            ${{ runner.temp }}/external-playback-diagnostic/smoothness-metrics.txt
            ${{ runner.temp }}/external-playback-diagnostic/fixture-source.txt
            ${{ runner.temp }}/external-playback-diagnostic/fixture-server.log
            ${{ runner.temp }}/fc2-external-emulator.log
          if-no-files-found: warn
          retention-days: 14
