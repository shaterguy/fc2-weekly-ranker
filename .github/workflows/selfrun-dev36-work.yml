name: SelfRun DEV36 Work

on:
  push:
    branches:
      - 'work/selfrun-dev36-161503'

permissions:
  contents: write
  actions: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout work branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
      - name: Install Android API 37
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Measure unchanged dev35 mixed-date baseline
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest --tests '*AvseeClientMixedDateBaselineTest*'
          BASELINE="$(grep -h -o 'DEV36_MIXED_DATE_BASELINE[^<]*' app/build/test-results/testDebugUnitTest/TEST-*.xml | tail -n 1)"
          test -n "$BASELINE"
          printf '%s\n' "$BASELINE" | tee "$RUNNER_TEMP/dev35-baseline.txt"
      - name: Apply minimal DEV36 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .selfrun/apply_dev36.py
          python3 .selfrun/finalize_dev36.py
      - name: Verify targeted GREEN and performance improvement
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest \
            --tests '*AvseeClientDev36RedTest*' \
            --tests '*AvseeClientMixedDatePerformanceTest*'
          CANDIDATE="$(grep -h -o 'DEV36_MIXED_DATE_CANDIDATE[^<]*' app/build/test-results/testDebugUnitTest/TEST-*.xml | tail -n 1)"
          test -n "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" | tee "$RUNNER_TEMP/dev36-candidate.txt"
          python3 - "$RUNNER_TEMP/dev35-baseline.txt" "$RUNNER_TEMP/dev36-candidate.txt" <<'PY'
          import re
          import sys
          from pathlib import Path
          baseline = Path(sys.argv[1]).read_text().strip()
          candidate = Path(sys.argv[2]).read_text().strip()
          def metric(text, key):
              m = re.search(rf"{key}=(\d+)", text)
              if not m:
                  raise SystemExit(f"missing {key}: {text}")
              return int(m.group(1))
          b_ms = metric(baseline, "median_ms")
          c_ms = metric(candidate, "median_ms")
          b_req = metric(baseline, "median_requests")
          c_req = metric(candidate, "median_requests")
          c_conc = metric(candidate, "max_concurrency")
          if c_ms * 100 > b_ms * 80:
              raise SystemExit(f"mixed-date improvement below 20%: baseline={b_ms} candidate={c_ms}")
          if c_req > b_req:
              raise SystemExit(f"candidate request count regressed: baseline={b_req} candidate={c_req}")
          if c_conc > 4:
              raise SystemExit(f"candidate concurrency exceeded 4: {c_conc}")
          print(f"DEV36_PERF_COMPARISON baseline_ms={b_ms} candidate_ms={c_ms} improvement_pct={(b_ms-c_ms)*100.0/b_ms:.1f} baseline_requests={b_req} candidate_requests={c_req} max_concurrency={c_conc}")
          PY
      - name: Canonical self-check
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify.sh
          grep -Fq 'versionCode = 60' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-dev36"' app/build.gradle.kts
          grep -Fq 'fc2_favorite_tags' app/src/main/java/com/shaterguy/fc2weeklyranker/data/SettingsStore.kt
          grep -Fq 'detailRecommendationCount' app/src/main/java/com/shaterguy/fc2weeklyranker/network/AvseeClient.kt
          grep -Fq 'detailCommentCount' app/src/main/java/com/shaterguy/fc2weeklyranker/network/AvseeClient.kt
      - name: Commit verified work tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .selfrun/apply_dev36.py .selfrun/finalize_dev36.py .github/workflows/selfrun-dev36-work.yml
          rmdir .selfrun 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add FC2 tags and detail metrics; speed mixed-date crawl'
          git push origin HEAD:refs/heads/work/selfrun-dev36-161503
          git rev-parse HEAD
