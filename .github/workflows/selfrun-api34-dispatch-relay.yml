name: SelfRun Android TEST dispatch relay

on:
  push:
    branches:
      - ci/SR-20260912-185344-92XVZW-api34-safe-trigger

permissions:
  contents: read
  actions: write

jobs:
  dispatch-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact candidate Android TEST
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: v0.2.0-dev24
          TARGET_SOURCE_SHA: b794bc681aff7c9cf4e6e30b910ca2c81a098a7e
        run: |
          set -euo pipefail
          REF_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq '.object.sha')"
          echo "TRIGGER_SHA=$GITHUB_SHA"
          echo "TARGET_REF_SHA=$REF_SHA"
          echo "TARGET_SOURCE_SHA=$TARGET_SOURCE_SHA"
          test "$REF_SHA" = "$TARGET_SOURCE_SHA"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android-test.yml/dispatches" \
            -f ref="$TARGET_REF"
          echo "DISPATCH_REQUEST_ACCEPTED=true"
