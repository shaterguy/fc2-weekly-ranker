name: Android STABLE RC

on:
  push:
    branches:
      - 'v*-rc*'
      - main
      - 'v0.1.0-release-recovery'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-stable:
    if: github.ref != 'refs/heads/v0.1.0-release-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
      - name: Install Android API 37
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build unsigned STABLE APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.fc2weeklyranker' versionCode='24' versionName='0.1.0'" <<<"$BADGING"
      - name: Sign and verify STABLE APK
        id: sign
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.FC2_WEEKLY_RANKER_TEST_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_PASSPHRASE:-}" ]]; then
            echo 'ERROR: repository signing seed is required for the STABLE APK.' >&2
            exit 1
          fi
          [[ "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == '3.12' ]]
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
          PASS_FILE="$RUNNER_TEMP/fc2-ranker-stable-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/37.0.0"
          UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          OUT=app/build/outputs/fc2-weekly-ranker-stable
          mkdir -p "$OUT"
          ALIGNED="$OUT/fc2-weekly-ranker-v0.1.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-aligned-unsigned.apk"
          APK="$OUT/fc2-weekly-ranker-v0.1.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          APKSIGNER="$BT/apksigner" bash tools/sign_stable.sh "$ALIGNED" "$PASS_FILE" "$APK" > "$OUT/APKSIGNER_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs-pem --min-sdk-version 29 "$APK" > "$OUT/APK_CERT.txt"
          BADGING="$("$BT/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.fc2weeklyranker' versionCode='24' versionName='0.1.0'" <<<"$BADGING"
          CERT_SHA256="$(awk -F= '/^certificate_sha256=/{print $2; exit}' "$OUT/APKSIGNER_VERIFY.txt" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CERT_SHA256" != 'ff32473e516ff59ca24ada94fe22e8282ce70fd66bd94fb0975340106d981cfd' ]]
          python3 - "$OUT/APK_CERT.txt" "$CERT_SHA256" <<'PY'
          import re
          import sys
          from pathlib import Path

          from cryptography import x509
          from cryptography.hazmat.primitives import hashes

          data = Path(sys.argv[1]).read_bytes()
          expected = sys.argv[2].lower()
          blocks = re.findall(
              rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----",
              data,
              flags=re.S,
          )
          if not blocks:
              raise SystemExit("no signer certificate PEM found in independent verification")
          fingerprints = {
              x509.load_pem_x509_certificate(block + b"\n").fingerprint(hashes.SHA256()).hex()
              for block in blocks
          }
          if expected not in fingerprints:
              raise SystemExit("independent STABLE signer certificate fingerprint mismatch")
          PY
          unzip -l "$APK" | grep -Fq 'AndroidManifest.xml'
          unzip -l "$APK" | grep -Fq 'classes.dex'
          printf '%s\n' "$CERT_SHA256" > "$OUT/STABLE_CERT_SHA256.txt"
          sha256sum "$APK" > "$OUT/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_COMMIT.txt"
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - name: Upload STABLE signing evidence
        if: steps.sign.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fc2-weekly-ranker-stable-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/fc2-weekly-ranker-stable/APKSIGNER_VERIFY.txt
            app/build/outputs/fc2-weekly-ranker-stable/APK_CERT.txt
            app/build/outputs/fc2-weekly-ranker-stable/STABLE_CERT_SHA256.txt
            app/build/outputs/fc2-weekly-ranker-stable/SHA256SUMS.txt
            app/build/outputs/fc2-weekly-ranker-stable/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload direct installable STABLE APK
        if: steps.sign.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: app/build/outputs/fc2-weekly-ranker-stable/fc2-weekly-ranker-v0.1.0-${{ github.run_id }}-${{ github.run_attempt }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  release-preflight:
    needs: package-stable
    if: github.ref != 'refs/heads/v0.1.0-release-recovery'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download STABLE APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fc2-weekly-ranker-v0.1.0-${{ github.run_id }}-${{ github.run_attempt }}.apk
          path: release-assets
      - name: Download STABLE evidence artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fc2-weekly-ranker-stable-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Validate release artifacts and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK_ARTIFACT="fc2-weekly-ranker-v0.1.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.apk"
          APK="release-assets/$APK_ARTIFACT"
          test -s "$APK"
          SOURCE_COMMIT="$(tr -d '[:space:]' < evidence/SOURCE_COMMIT.txt)"
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          EXPECTED_SHA256="$(awk '{print $1; exit}' evidence/SHA256SUMS.txt | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACTUAL_SHA256" == "$EXPECTED_SHA256" ]]
          CERT_SHA256="$(tr -d '[:space:]' < evidence/STABLE_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CERT_SHA256" != 'ff32473e516ff59ca24ada94fe22e8282ce70fd66bd94fb0975340106d981cfd' ]]
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" >/dev/null 2>&1; then
            echo 'ERROR: published GitHub Release v0.1.0 already exists.' >&2
            exit 1
          fi
          echo "release_preflight_source=$SOURCE_COMMIT"
          echo "release_preflight_apk_sha256=$ACTUAL_SHA256"
          echo "release_preflight_cert_sha256=$CERT_SHA256"

  publish-release:
    needs:
      - package-stable
      - release-preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download STABLE APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fc2-weekly-ranker-v0.1.0-${{ github.run_id }}-${{ github.run_attempt }}.apk
          path: release-assets
      - name: Download STABLE evidence artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fc2-weekly-ranker-stable-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Publish v0.1.0 from verified main artifact
        shell: bash
        run: |
          set -euo pipefail
          APK_ARTIFACT="fc2-weekly-ranker-v0.1.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.apk"
          SOURCE_COMMIT="$(tr -d '[:space:]' < evidence/SOURCE_COMMIT.txt)"
          [[ "$SOURCE_COMMIT" == "$GITHUB_SHA" ]]
          SRC_APK="release-assets/$APK_ARTIFACT"
          test -s "$SRC_APK"
          APK="release-assets/fc2-weekly-ranker-v0.1.0.apk"
          cp "$SRC_APK" "$APK"
          EXPECTED_SHA256="$(awk '{print $1; exit}' evidence/SHA256SUMS.txt | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          [[ "$ACTUAL_SHA256" == "$EXPECTED_SHA256" ]]
          printf '%s  %s\n' "$ACTUAL_SHA256" "$(basename "$APK")" > release-assets/SHA256SUMS.txt
          CERT_SHA256="$(tr -d '[:space:]' < evidence/STABLE_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CERT_SHA256" != 'ff32473e516ff59ca24ada94fe22e8282ce70fd66bd94fb0975340106d981cfd' ]]
          if TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$TAG_SHA" == "$GITHUB_SHA" ]] || { echo 'ERROR: existing v0.1.0 tag points elsewhere.' >&2; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/tags/v0.1.0' -f sha="$GITHUB_SHA" >/dev/null
          fi
          cat > release-assets/RELEASE_NOTES.md <<EOF
          FC2 Weekly Ranker v0.1.0

          - Functional baseline: v0.1.0-dev24 (c4f1ec5029f1dab3ef7c3a6dfbb3095a2f65ae71)
          - Stable release commit: $GITHUB_SHA
          - Package: com.shaterguy.fc2weeklyranker
          - versionCode: 24
          - versionName: 0.1.0
          - STABLE signing certificate SHA-256: $CERT_SHA256
          - APK SHA-256: $ACTUAL_SHA256
          - Verification run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ERROR: published GitHub Release v0.1.0 already exists.' >&2
            exit 1
          fi
          gh release create v0.1.0 \
            "$APK#FC2 Weekly Ranker v0.1.0 APK" \
            "release-assets/SHA256SUMS.txt#SHA-256 checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title 'v0.1.0' \
            --notes-file release-assets/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          RELEASE_ID="$(jq -r '[.[] | select(.tag_name == "v0.1.0" and .draft == true)] | if length == 1 then .[0].id else empty end' "$RUNNER_TEMP/releases.json")"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo 'ERROR: expected exactly one v0.1.0 draft release.' >&2; exit 1; }
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" --jq '{tag_name, draft, prerelease, html_url, assets: [.assets[] | {name, size, digest}]}'

  recover-draft-release:
    if: github.ref == 'refs/heads/v0.1.0-release-recovery'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate and publish existing v0.1.0 draft
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE='1cbf74af51e76a9d80d03af34a30a8b0896b5215'
          EXPECTED_RELEASE_ID='380184210'
          EXPECTED_APK_DIGEST='sha256:b217287fb3ee796debd662c30c930e9c3b316031fbe1484870b80408b9654c82'
          EXPECTED_APK_SIZE='34102379'
          EXPECTED_SUMS_DIGEST='sha256:fb162904e93ec10c23ca47de3a2e298cfb38a278add74a455e4156f534f8e3ab'
          EXPECTED_SUMS_SIZE='95'

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq '.object.sha')"
          [[ "$MAIN_SHA" == "$EXPECTED_SOURCE" ]]
          [[ "$TAG_SHA" == "$EXPECTED_SOURCE" ]]

          RELEASES_JSON="$RUNNER_TEMP/releases.json"
          DRAFT_JSON="$RUNNER_TEMP/v0.1.0-draft.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES_JSON"
          DRAFT_COUNT="$(jq '[.[] | select(.tag_name == "v0.1.0" and .draft == true)] | length' "$RELEASES_JSON")"
          [[ "$DRAFT_COUNT" == '1' ]] || { echo "ERROR: expected exactly one v0.1.0 draft release, found $DRAFT_COUNT." >&2; exit 1; }
          jq '[.[] | select(.tag_name == "v0.1.0" and .draft == true)] | .[0]' "$RELEASES_JSON" > "$DRAFT_JSON"

          RELEASE_ID="$(jq -r '.id' "$DRAFT_JSON")"
          [[ "$RELEASE_ID" == "$EXPECTED_RELEASE_ID" ]]
          jq -e --arg source "$EXPECTED_SOURCE" '
            .tag_name == "v0.1.0" and
            .target_commitish == "main" and
            .name == "v0.1.0" and
            .draft == true and
            .prerelease == false and
            (.body | contains("Stable release commit: " + $source))
          ' "$DRAFT_JSON" >/dev/null

          APK_COUNT="$(jq --arg digest "$EXPECTED_APK_DIGEST" --argjson size "$EXPECTED_APK_SIZE" '[.assets[] | select(.name == "fc2-weekly-ranker-v0.1.0.apk" and .size == $size and .digest == $digest and .state == "uploaded")] | length' "$DRAFT_JSON")"
          SUMS_COUNT="$(jq --arg digest "$EXPECTED_SUMS_DIGEST" --argjson size "$EXPECTED_SUMS_SIZE" '[.assets[] | select(.name == "SHA256SUMS.txt" and .size == $size and .digest == $digest and .state == "uploaded")] | length' "$DRAFT_JSON")"
          [[ "$APK_COUNT" == '1' ]]
          [[ "$SUMS_COUNT" == '1' ]]
          [[ "$(jq '.assets | length' "$DRAFT_JSON")" == '2' ]]

          PUBLISHED_JSON="$RUNNER_TEMP/v0.1.0-published.json"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true > "$PUBLISHED_JSON"
          jq -e --argjson id "$EXPECTED_RELEASE_ID" --arg digest "$EXPECTED_APK_DIGEST" --argjson size "$EXPECTED_APK_SIZE" '
            .id == $id and
            .tag_name == "v0.1.0" and
            .draft == false and
            .prerelease == false and
            ([.assets[] | select(.name == "fc2-weekly-ranker-v0.1.0.apk" and .size == $size and .digest == $digest and (.browser_download_url | contains("/releases/download/v0.1.0/")))] | length == 1)
          ' "$PUBLISHED_JSON" >/dev/null

          BY_TAG_JSON="$RUNNER_TEMP/v0.1.0-by-tag.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" > "$BY_TAG_JSON"
          jq -e --argjson id "$EXPECTED_RELEASE_ID" --arg source "$EXPECTED_SOURCE" --arg digest "$EXPECTED_APK_DIGEST" --argjson size "$EXPECTED_APK_SIZE" '
            .id == $id and
            .tag_name == "v0.1.0" and
            .draft == false and
            .prerelease == false and
            (.body | contains("Stable release commit: " + $source)) and
            ([.assets[] | select(.name == "fc2-weekly-ranker-v0.1.0.apk" and .size == $size and .digest == $digest)] | length == 1) and
            ([.assets[] | select(.name == "SHA256SUMS.txt")] | length == 1)
          ' "$BY_TAG_JSON" >/dev/null
          jq '{id, tag_name, draft, prerelease, html_url, published_at, assets: [.assets[] | {name, size, digest, browser_download_url}]}' "$BY_TAG_JSON"
