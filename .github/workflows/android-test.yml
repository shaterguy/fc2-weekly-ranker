name: Android TEST

on:
  push:
    branches:
      - 'v*-dev*'
      - 'v*-rc*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
      - name: Install Android API 37
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Canonical verification
        run: bash scripts/verify.sh
      - name: Build unsigned TEST APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.fc2weeklyranker.dev' versionCode='40' versionName='0.2.0-dev16'" <<<"$BADGING"
          printf '%s\n' "$GITHUB_SHA" > app/build/outputs/apk/debug/SOURCE_COMMIT.txt
          sha256sum "$APK" > app/build/outputs/apk/debug/UNSIGNED_SHA256SUMS.txt
      - name: Upload unsigned TEST provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fc2-weekly-ranker-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*-unsigned.apk
            app/build/outputs/apk/debug/UNSIGNED_SHA256SUMS.txt
            app/build/outputs/apk/debug/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Sign and verify TEST APK
        id: sign
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.FC2_WEEKLY_RANKER_TEST_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_PASSPHRASE:-}" ]]; then
            echo 'ERROR: FC2_WEEKLY_RANKER_TEST_SIGNING_PASSPHRASE is required for the installable TEST APK.' >&2
            exit 1
          fi
          [[ "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == '3.12' ]]
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r tools/signing-requirements-linux-x86_64-py312.txt
          PASS_FILE="$RUNNER_TEMP/fc2-ranker-signing-pass"
          trap 'rm -f "$PASS_FILE"' EXIT
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          BT="$ANDROID_HOME/build-tools/37.0.0"
          UNSIGNED="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          OUT=app/build/outputs/fc2-weekly-ranker-test
          mkdir -p "$OUT"
          ALIGNED="$OUT/fc2-weekly-ranker-test-v0.2.0-dev16-aligned-unsigned.apk"
          APK="$OUT/fc2-weekly-ranker-test-v0.2.0-dev16.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          APKSIGNER="$BT/apksigner" bash tools/sign_test.sh "$ALIGNED" "$PASS_FILE" "$APK" > "$OUT/APKSIGNER_VERIFY.txt"
          "$BT/apksigner" verify --verbose --print-certs-pem --min-sdk-version 29 "$APK" > "$OUT/APK_CERT.txt"
          BADGING="$("$BT/aapt" dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.fc2weeklyranker.dev' versionCode='40' versionName='0.2.0-dev16'" <<<"$BADGING"
          PINNED_TEST_CERT_SHA256='ff32473e516ff59ca24ada94fe22e8282ce70fd66bd94fb0975340106d981cfd'
          CERT_SHA256="$(awk -F= '/^certificate_sha256=/{print $2; exit}' "$OUT/APKSIGNER_VERIFY.txt" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CERT_SHA256" == "$PINNED_TEST_CERT_SHA256" ]]
          python3 - "$OUT/APK_CERT.txt" "$PINNED_TEST_CERT_SHA256" <<'PY'
          import re
          import sys
          from pathlib import Path
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes
          data = Path(sys.argv[1]).read_bytes()
          expected = sys.argv[2].lower()
          blocks = re.findall(rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", data, flags=re.S)
          if not blocks:
              raise SystemExit("no signer certificate PEM found in independent verification")
          fingerprints = {x509.load_pem_x509_certificate(block + b"\n").fingerprint(hashes.SHA256()).hex() for block in blocks}
          if expected not in fingerprints:
              raise SystemExit("independent signer certificate fingerprint mismatch")
          PY
          printf '%s\n' "$CERT_SHA256" > "$OUT/TEST_CERT_SHA256.txt"
          echo "TEST_CERT_SHA256=$CERT_SHA256"
          sha256sum "$APK" > "$OUT/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_COMMIT.txt"
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - name: Verify DEV upgrade migration and stable co-install
        if: steps.sign.outputs.configured == 'true'
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.FC2_WEEKLY_RANKER_TEST_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/37.0.0"
          CURRENT_APK="$GITHUB_WORKSPACE/app/build/outputs/fc2-weekly-ranker-test/fc2-weekly-ranker-test-v0.2.0-dev16.apk"
          OLD="$RUNNER_TEMP/fc2-dev15"
          PASS_FILE="$RUNNER_TEMP/fc2-ranker-signing-pass-compat"
          AVD_NAME=fc2-compat
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'rm -f "$PASS_FILE"; adb emu kill >/dev/null 2>&1 || true' EXIT

          git fetch --no-tags origin refs/heads/v0.2.0-dev15:refs/remotes/origin/v0.2.0-dev15
          git worktree add --detach "$OLD" refs/remotes/origin/v0.2.0-dev15
          gradle --no-daemon --stacktrace -p "$OLD" :app:assembleDebug
          OLD_UNSIGNED="$(find "$OLD/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          test -s "$OLD_UNSIGNED"
          OLD_ALIGNED="$RUNNER_TEMP/fc2-weekly-ranker-test-v0.2.0-dev15-aligned.apk"
          OLD_APK="$RUNNER_TEMP/fc2-weekly-ranker-test-v0.2.0-dev15.apk"
          "$BT/zipalign" -p -f 4 "$OLD_UNSIGNED" "$OLD_ALIGNED"
          umask 077
          printf '%s' "$SIGNING_PASSPHRASE" > "$PASS_FILE"
          APKSIGNER="$BT/apksigner" bash "$OLD/tools/sign_test.sh" "$OLD_ALIGNED" "$PASS_FILE" "$OLD_APK" >/dev/null
          "$BT/apksigner" verify --min-sdk-version 29 "$OLD_APK"

          sdkmanager "platform-tools" "emulator" "system-images;android-29;google_apis;x86_64"
          echo no | avdmanager create avd --force --name "$AVD_NAME" --package "system-images;android-29;google_apis;x86_64" --device pixel --path "$ANDROID_AVD_HOME/$AVD_NAME.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq "$AVD_NAME"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >/tmp/fc2-emulator.log 2>&1 &
          if ! timeout 180s adb wait-for-device; then
            echo 'ERROR: Android emulator did not expose an adb device within 180 seconds.' >&2
            cat /tmp/fc2-emulator.log >&2 || true
            exit 1
          fi
          for _ in $(seq 1 120); do
            [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]]; then
            echo 'ERROR: Android emulator did not complete boot within 240 seconds after adb became available.' >&2
            cat /tmp/fc2-emulator.log >&2 || true
            exit 1
          fi

          STABLE_APK="$RUNNER_TEMP/fc2-weekly-ranker-v0.1.0.apk"
          curl --fail --location --retry 3 --output "$STABLE_APK" "https://github.com/shaterguy/fc2-weekly-ranker/releases/download/v0.1.0/fc2-weekly-ranker-v0.1.0.apk"
          adb install "$STABLE_APK"
          adb install "$OLD_APK"
          adb shell am start -W -n com.shaterguy.fc2weeklyranker.dev/com.shaterguy.fc2weeklyranker.MainActivity >/dev/null
          sleep 4
          adb shell am force-stop com.shaterguy.fc2weeklyranker.dev
          sleep 1

          OLD_DB_DIR="$RUNNER_TEMP/dev15-db"
          mkdir -p "$OLD_DB_DIR"
          adb exec-out run-as com.shaterguy.fc2weeklyranker.dev cat databases/ranker.db > "$OLD_DB_DIR/ranker.db"
          for suffix in -wal -shm; do
            if adb shell run-as com.shaterguy.fc2weeklyranker.dev test -f "databases/ranker.db${suffix}"; then
              adb exec-out run-as com.shaterguy.fc2weeklyranker.dev cat "databases/ranker.db${suffix}" > "$OLD_DB_DIR/ranker.db${suffix}"
            fi
          done
          OLD_DB="$OLD_DB_DIR/ranker.db"
          python3 - "$OLD_DB" <<'PY'
          import sqlite3
          import sys
          path = sys.argv[1]
          con = sqlite3.connect(path)
          version = con.execute("PRAGMA user_version").fetchone()[0]
          if version != 2:
              raise SystemExit(f"expected DEV15 database v2, got {version}")
          con.execute("PRAGMA foreign_keys=ON")
          con.execute("INSERT OR REPLACE INTO posts(id,url,title,postedAtEpochMillis,recommendationCount,dailyRate,snapshotKey,fetchedAtEpochMillis) VALUES(?,?,?,?,?,?,?,?)", ("compat-marker", "https://example.test/compat", "compat-marker", 1, 9, 9.0, "compat", 2))
          con.execute("INSERT OR REPLACE INTO favorites(postId,createdAtEpochMillis) VALUES(?,?)", ("compat-marker", 3))
          con.execute("INSERT OR REPLACE INTO videos(id,postId,url,referer,userAgent,sourceKind,ordinal,discoveredAtEpochMillis) VALUES(?,?,?,?,?,?,?,?)", ("compat-video", "compat-marker", "https://example.test/video.mp4", "https://example.test/compat", "ua", "DIRECT", 0, 4))
          con.execute("INSERT OR REPLACE INTO downloads(videoId,status,contentUri,downloadedBytes,totalBytes,errorCode,updatedAtEpochMillis,enqueueOrder,retryCount) VALUES(?,?,?,?,?,?,?,?,?)", ("compat-video", "PAUSED", None, 123, 1000, None, 5, 777, 2))
          con.commit()
          con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          con.close()
          PY
          adb shell run-as com.shaterguy.fc2weeklyranker.dev rm -f databases/ranker.db-wal databases/ranker.db-shm
          adb shell run-as com.shaterguy.fc2weeklyranker.dev sh -c 'cat > databases/ranker.db' < "$OLD_DB"

          adb install -r "$CURRENT_APK"
          adb shell am start -W -n com.shaterguy.fc2weeklyranker.dev/com.shaterguy.fc2weeklyranker.MainActivity >/dev/null
          sleep 5
          adb shell am force-stop com.shaterguy.fc2weeklyranker.dev
          sleep 1

          NEW_DB_DIR="$RUNNER_TEMP/dev16-db"
          mkdir -p "$NEW_DB_DIR"
          adb exec-out run-as com.shaterguy.fc2weeklyranker.dev cat databases/ranker.db > "$NEW_DB_DIR/ranker.db"
          for suffix in -wal -shm; do
            if adb shell run-as com.shaterguy.fc2weeklyranker.dev test -f "databases/ranker.db${suffix}"; then
              adb exec-out run-as com.shaterguy.fc2weeklyranker.dev cat "databases/ranker.db${suffix}" > "$NEW_DB_DIR/ranker.db${suffix}"
            fi
          done
          NEW_DB="$NEW_DB_DIR/ranker.db"
          python3 - "$NEW_DB" <<'PY'
          import sqlite3
          import sys
          con = sqlite3.connect(sys.argv[1])
          version = con.execute("PRAGMA user_version").fetchone()[0]
          if version != 3:
              raise SystemExit(f"expected DEV16 database v3, got {version}")
          tables = {row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          if "rank_observations" not in tables:
              raise SystemExit("rank_observations table missing after migration")
          if con.execute("SELECT COUNT(*) FROM posts WHERE id='compat-marker'").fetchone()[0] != 1:
              raise SystemExit("post marker lost during migration")
          if con.execute("SELECT COUNT(*) FROM favorites WHERE postId='compat-marker'").fetchone()[0] != 1:
              raise SystemExit("favorite marker lost during migration")
          if con.execute("SELECT COUNT(*) FROM videos WHERE id='compat-video'").fetchone()[0] != 1:
              raise SystemExit("video marker lost during migration")
          download = con.execute("SELECT downloadedBytes,totalBytes,enqueueOrder,retryCount FROM downloads WHERE videoId='compat-video'").fetchone()
          if download != (123, 1000, 777, 2):
              raise SystemExit(f"download marker changed during migration: {download}")
          con.close()
          PY

          adb shell dumpsys package com.shaterguy.fc2weeklyranker | grep -Fq 'versionName=0.1.0'
          adb shell dumpsys package com.shaterguy.fc2weeklyranker.dev | grep -Fq 'versionName=0.2.0-dev16'
      - name: Upload signed TEST evidence
        if: steps.sign.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fc2-weekly-ranker-signed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/fc2-weekly-ranker-test/APKSIGNER_VERIFY.txt
            app/build/outputs/fc2-weekly-ranker-test/APK_CERT.txt
            app/build/outputs/fc2-weekly-ranker-test/TEST_CERT_SHA256.txt
            app/build/outputs/fc2-weekly-ranker-test/SHA256SUMS.txt
            app/build/outputs/fc2-weekly-ranker-test/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload direct installable TEST APK
        if: steps.sign.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: app/build/outputs/fc2-weekly-ranker-test/fc2-weekly-ranker-test-v0.2.0-dev16.apk
          archive: false
          if-no-files-found: error
          retention-days: 14